schema: hermes-kanban-fleet/v1
source_profile: default
provider: CCSwitch
model: gpt-5.6-sol
terminal_home_mode: auto
profiles:
  orchestrator:
    description: "Owns explicit Kanban DAGs, dependency links, specialist routing, and evidence-based completion. Runs event-driven without duplicate decomposition or polling workers."
    tools: [skills, todo, memory, session_search, clarify]
  researcher:
    description: "Evidence and research specialist. Produces bounded findings with source and artifact pointers; avoids raw dumps and large implementation unless explicitly scoped."
    tools: [web, browser, terminal, file, code_execution, vision, skills, todo, memory, session_search]
  coder:
    description: "Implementation specialist. Performs deterministic verification, repairs engineering defects, and hands completed work to native Kanban review with compact evidence."
    tools: [web, browser, terminal, file, code_execution, vision, skills, todo, memory, session_search]
  reviewer:
    description: "Independent review specialist. Classifies P0/P1/P2 findings, verifies evidence, requests native changes when required, and does not silently fix reviewed work."
    tools: [terminal, file, code_execution, skills, todo, memory, session_search]
kanban:
  auto_decompose: false
  orchestrator_profile: orchestrator
  default_assignee: default
  dispatch_in_gateway: true
  review_dispatch: true
  max_in_progress: 4
